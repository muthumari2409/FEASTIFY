<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Feastify</title>
  <meta name="description" content="Create your Feastify account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173b30'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23e3a13a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5, Font Awesome icons and Google Fonts (loaded from the internet) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">

  <!-- Feastify styles -->
  <link rel="stylesheet" href="static/css/style.css">

  <!-- api.js must load first (shared helpers + image fallback) -->
  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
</head>
<body data-page="register" data-nav="solid" data-auth="guest">
  <!-- Navbar is built by static/js/main.js so it is identical on every page -->
  <div id="site-navbar"></div>

  <main id="main">
    <section class="auth-section">
      <div class="container">
        <div class="auth-card mx-auto" style="max-width:1040px">
          <div class="auth-visual">
            <img src="static/images/register.jpg" data-fallback="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=900&q=80" alt="Feastify courtyard">
            <div><h2>Join Feastify</h2><p>Reserve tables in seconds, keep your booking history and manage changes yourself.</p></div>
          </div>
          <div class="auth-form-side">
            <h1>Create an account</h1>
            <p class="text-muted-soft mb-4">It takes less than a minute.</p>
            <div id="registerAlert" class="form-alert" role="alert"></div>
            <form id="registerForm" class="feast-form" novalidate>
              <div class="row g-3">
                <div class="col-12"><label class="form-label" for="rName">Full name</label>
                  <div class="input-icon"><i class="fa-regular fa-user"></i><input id="rName" name="name" class="form-control" required maxlength="50" autocomplete="name" placeholder="e.g. Muthumari M"></div></div>
                <div class="col-md-6"><label class="form-label" for="rEmail">Email</label>
                  <div class="input-icon"><i class="fa-regular fa-envelope"></i><input id="rEmail" name="email" type="email" class="form-control" required autocomplete="email" placeholder="you@example.com"></div></div>
                <div class="col-md-6"><label class="form-label" for="rPhone">Phone</label>
                  <div class="input-icon"><i class="fa-solid fa-phone"></i><input id="rPhone" name="phone" type="tel" class="form-control" required autocomplete="tel" placeholder="9876543210"></div></div>
                <div class="col-md-6"><label class="form-label" for="rPass">Password</label>
                  <div class="input-icon"><i class="fa-solid fa-lock"></i><input id="rPass" name="password" type="password" class="form-control" required autocomplete="new-password">
                    <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
                  <div class="strength"><span id="strengthBar"></span></div>
                  <div class="hint" id="strengthLabel">Use 8+ characters with letters and numbers.</div></div>
                <div class="col-md-6"><label class="form-label" for="rConfirm">Confirm password</label>
                  <div class="input-icon"><i class="fa-solid fa-lock"></i><input id="rConfirm" name="confirm_password" type="password" class="form-control" required autocomplete="new-password">
                    <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div>
                <div class="col-12"><div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rTerms" name="terms">
                  <label class="form-check-label small" for="rTerms">I agree to the booking policy: tables are held for 15 minutes after the booked time.</label>
                </div></div>
              </div>
              <button type="submit" class="btn btn-saffron w-100 btn-lg mt-4">Create account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is built by static/js/main.js -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
