<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile | Feastify</title>
  <meta name="description" content="Your Feastify account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173b30'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23e3a13a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5, Font Awesome icons and Google Fonts (loaded from the internet) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">

  <!-- Feastify styles -->
  <link rel="stylesheet" href="static/css/style.css">

  <!-- api.js must load first (shared helpers + image fallback) -->
  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
</head>
<body data-page="profile" data-auth="required">
  <!-- Navbar is built by static/js/main.js so it is identical on every page -->
  <div id="site-navbar"></div>

  <main id="main">
    <header class="page-header bg-plain">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> / Profile</div>
        <div class="profile-hero">
          <div class="profile-avatar" data-user-initials></div>
          <div>
            <h1 class="mb-1" data-user-name></h1>
            <p><span data-user-email></span></p>
          </div>
        </div>
      </div>
    </header>

    <section class="section section-bone">
      <div class="container">
        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-regular fa-calendar"></i></div><div><strong id="pfBookings">0</strong><span>Total bookings</span></div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-regular fa-clock"></i></div><div><strong id="pfUpcoming">0</strong><span>Upcoming</span></div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-solid fa-door-open"></i></div><div><strong id="pfVisits">0</strong><span>Website visits</span></div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-solid fa-clock-rotate-left"></i></div><div><strong id="pfLastVisit" style="font-size:1.05rem">-</strong><span>Last visit</span></div></div></div>
        </div>

        <div class="row g-4">
          <div class="col-lg-5">
            <div class="panel h-100">
              <h2 class="h4 mb-3">Account information</h2>
              <ul class="info-list">
                <li><i class="fa-regular fa-user"></i><div><small>Name</small><strong id="pfName">-</strong></div></li>
                <li><i class="fa-regular fa-envelope"></i><div><small>Email</small><strong id="pfEmail">-</strong></div></li>
                <li><i class="fa-solid fa-phone"></i><div><small>Phone</small><strong id="pfPhone">-</strong></div></li>
                <li><i class="fa-regular fa-calendar-plus"></i><div><small>Member since</small><strong id="pfSince">-</strong></div></li>
                <li><i class="fa-solid fa-right-to-bracket"></i><div><small>Last login</small><strong id="pfLastLogin">-</strong></div></li>
                <li><i class="fa-regular fa-bell"></i><div><small>Next booking</small><strong id="pfNext" class="fw-normal">-</strong></div></li>
              </ul>
              <div class="d-flex flex-wrap gap-2 mt-3">
                <a href="my-bookings.html" class="btn btn-leaf btn-sm">My Bookings</a>
                <a href="booking.html" class="btn btn-ghost-leaf btn-sm">Book a table</a>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="panel mb-4">
              <h2 class="h4 mb-3">Edit profile</h2>
              <div id="profileAlert" class="form-alert" role="alert"></div>
              <form id="profileForm" class="feast-form" novalidate>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label" for="pName">Full name</label><input id="pName" name="name" class="form-control" required maxlength="50"></div>
                  <div class="col-md-6"><label class="form-label" for="pPhone">Phone</label><input id="pPhone" name="phone" type="tel" class="form-control" required maxlength="20"></div>
                  <div class="col-12"><label class="form-label" for="pEmail">Email</label><input id="pEmail" name="email" type="email" class="form-control" readonly><div class="hint">Email is your login and cannot be changed.</div></div>
                </div>
                <button type="submit" class="btn btn-saffron mt-3">Save changes</button>
              </form>
            </div>
            <div class="panel">
              <h2 class="h4 mb-3">Change password</h2>
              <div id="passwordAlert" class="form-alert" role="alert"></div>
              <form id="passwordForm" class="feast-form" novalidate>
                <div class="row g-3">
                  <div class="col-12"><label class="form-label" for="pwCurrent">Current password</label><input id="pwCurrent" name="current_password" type="password" class="form-control" autocomplete="current-password" required></div>
                  <div class="col-md-6"><label class="form-label" for="pwNew">New password</label><input id="pwNew" name="new_password" type="password" class="form-control" autocomplete="new-password" required></div>
                  <div class="col-md-6"><label class="form-label" for="pwConfirm">Confirm new password</label><input id="pwConfirm" name="confirm_password" type="password" class="form-control" autocomplete="new-password" required></div>
                </div>
                <button type="submit" class="btn btn-leaf mt-3">Change password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is built by static/js/main.js -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
