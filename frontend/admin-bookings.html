<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings | Feastify Admin</title>
  <meta name="description" content="Feastify restaurant management - admin area">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173b30'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23e3a13a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5, Font Awesome icons and Google Fonts (loaded from the internet) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">

  <!-- Feastify styles -->
  <link rel="stylesheet" href="static/css/admin.css">

  <!-- api.js must load first (shared helpers + image fallback) -->
  <script src="static/js/api.js"></script>
  <meta name="robots" content="noindex">
</head>
<!-- Admin page: does NOT load main.js, so admins are never counted as website visitors -->
<body class="admin-body" data-admin-page="bookings">
  <div class="auth-overlay" id="authOverlay"><div><span class="spinner-border spinner-border-sm me-2"></span>Checking admin access...</div></div>

  <div class="admin-wrapper">
    <!-- Sidebar is built by static/js/admin.js -->
    <nav class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation"></nav>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        <div>
          <h1>Bookings</h1>
          <div class="sub">Every reservation, updated every 30 seconds</div>
        </div>
        <div class="actions">
          <span class="updated-at"><span class="live-dot"></span><span class="txt">Updated</span> <span id="updatedAt">-</span></span>
          <button class="btn btn-soft btn-sm" id="refreshBtn" type="button"><i class="fa-solid fa-rotate me-1"></i>Refresh</button>
        </div>
      </header>

      <main class="admin-content">
        <div class="a-panel">
          <div class="a-panel-head">
            <div><h2>All bookings</h2><p id="resultCount">Loading...</p></div>
            <div class="filters">
              <div class="search-in"><i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" class="form-control" id="searchInput" placeholder="Name, email, phone or booking ID" aria-label="Search bookings"></div>
              <input type="date" class="form-control" id="filterDate" aria-label="Filter by date">
              <button type="button" class="btn btn-soft" id="todayBtn">Today</button>
              <button type="button" class="btn btn-soft" id="clearFilters"><i class="fa-solid fa-xmark me-1"></i>Clear</button>
            </div>
          </div>
          <div class="status-tabs" id="statusTabs" role="group" aria-label="Filter by status"><button type="button" data-status="" class="active">All<span class="n">0</span></button><button type="button" data-status="Pending">Pending<span class="n">0</span></button><button type="button" data-status="Confirmed">Confirmed<span class="n">0</span></button><button type="button" data-status="Completed">Completed<span class="n">0</span></button><button type="button" data-status="Cancelled">Cancelled<span class="n">0</span></button></div>
          <div class="table-wrap">
            <table class="a-table">
              <thead><tr><th>Booking ID</th><th>Customer</th><th>Email</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Table</th><th>Status</th><th>Created At</th><th>Actions</th></tr></thead>
              <tbody id="bookingsBody"><tr class="empty-row"><td colspan="11">Loading...</td></tr></tbody>
            </table>
          </div>
          <p class="small text-muted mt-3 mb-0"><i class="fa-solid fa-circle-info me-1"></i>
            <i class="fa-solid fa-check"></i> confirm &middot; <i class="fa-solid fa-flag-checkered"></i> mark completed &middot;
            <i class="fa-solid fa-xmark"></i> cancel (frees the table for other customers).</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Booking details modal -->
  <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h2 class="modal-title h5" id="bookingModalTitle">Booking details</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="bookingModalBody"></div>
        <div class="modal-footer border-0" id="bookingModalFoot"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/admin.js"></script>
</body>
</html>
