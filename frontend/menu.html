<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Feastify</title>
  <meta name="description" content="Feastify menu - starters, main course, desserts and drinks.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173b30'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23e3a13a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5, Font Awesome icons and Google Fonts (loaded from the internet) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">

  <!-- Feastify styles -->
  <link rel="stylesheet" href="static/css/style.css">

  <!-- api.js must load first (shared helpers + image fallback) -->
  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
</head>
<body data-page="menu">
  <!-- Navbar is built by static/js/main.js so it is identical on every page -->
  <div id="site-navbar"></div>

  <main id="main">
    <header class="page-header bg-menu">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> / Menu</div>
        <h1>Our menu</h1>
        <p>Starters, mains, desserts and drinks. Prices include taxes.</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div class="filter-bar" role="group" aria-label="Filter by category">
            <button type="button" class="filter-pill active" data-menu-filter="All" aria-pressed="true">All</button>
            <button type="button" class="filter-pill" data-menu-filter="Starters" aria-pressed="false">Starters</button>
            <button type="button" class="filter-pill" data-menu-filter="Main Course" aria-pressed="false">Main Course</button>
            <button type="button" class="filter-pill" data-menu-filter="Desserts" aria-pressed="false">Desserts</button>
            <button type="button" class="filter-pill" data-menu-filter="Drinks" aria-pressed="false">Drinks</button>
          </div>
          <div class="search-box feast-form">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="menuSearch" class="form-control" placeholder="Search dishes" aria-label="Search dishes">
          </div>
        </div>

        <!-- menu cards are drawn by static/js/main.js from the MENU list -->
        <div id="menuGrid" aria-live="polite"></div>

        <div class="panel-bone mt-5 d-flex flex-wrap gap-3 align-items-center justify-content-between">
          <div><strong>Allergies or dietary needs?</strong> <span class="text-muted-soft">Add them in the special request box when you book and the kitchen will plan ahead.</span></div>
          <a href="booking.html" class="btn btn-leaf btn-sm">Book a table</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is built by static/js/main.js -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
