<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My bookings | Feastify</title>
  <meta name="description" content="Your Feastify booking history.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173b30'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23e3a13a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5, Font Awesome icons and Google Fonts (loaded from the internet) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">

  <!-- Feastify styles -->
  <link rel="stylesheet" href="static/css/style.css">

  <!-- api.js must load first (shared helpers + image fallback) -->
  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
</head>
<body data-page="my-bookings" data-auth="required">
  <!-- Navbar is built by static/js/main.js so it is identical on every page -->
  <div id="site-navbar"></div>

  <main id="main">
    <header class="page-header bg-booking">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> / My Bookings</div>
        <h1><span data-user-name></span>'s Bookings</h1>
        <p>Upcoming reservations, past visits and cancellations. Status updates from the restaurant appear here automatically.</p>
      </div>
    </header>

    <section class="section section-bone">
      <div class="container">
        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-solid fa-list"></i></div><div><strong id="statTotal">0</strong><span>All bookings</span></div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-regular fa-clock"></i></div><div><strong id="statUpcoming">0</strong><span>Upcoming</span></div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-solid fa-flag-checkered"></i></div><div><strong id="statPast">0</strong><span>Past</span></div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-tile"><div class="icon"><i class="fa-solid fa-ban"></i></div><div><strong id="statCancelled">0</strong><span>Cancelled</span></div></div></div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <ul class="nav feast-tabs" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-upcoming" type="button" role="tab">Upcoming<span class="count" id="count-upcoming">0</span></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-past" type="button" role="tab">Past<span class="count" id="count-past">0</span></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cancelled" type="button" role="tab">Cancelled<span class="count" id="count-cancelled">0</span></button></li>
          </ul>
          <a href="booking.html" class="btn btn-saffron mb-4"><i class="fa-solid fa-plus me-2"></i>New booking</a>
        </div>

        <div class="tab-content" id="myBookings">
          <div class="tab-pane fade show active" id="tab-upcoming" role="tabpanel"><div id="list-upcoming"><div class="empty-state"><div class="spinner-border text-success"></div></div></div></div>
          <div class="tab-pane fade" id="tab-past" role="tabpanel"><div id="list-past"></div></div>
          <div class="tab-pane fade" id="tab-cancelled" role="tabpanel"><div id="list-cancelled"></div></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is built by static/js/main.js -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/booking.js"></script>
</body>
</html>
