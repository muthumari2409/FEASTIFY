<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Feastify</title>
  <meta name="description" content="Log in to your Feastify account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173b30'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' fill='%23e3a13a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5, Font Awesome icons and Google Fonts (loaded from the internet) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">

  <!-- Feastify styles -->
  <link rel="stylesheet" href="static/css/style.css">

  <!-- api.js must load first (shared helpers + image fallback) -->
  <script src="static/js/api.js"></script>
  <script src="static/js/main.js"></script>
</head>
<body data-page="login" data-nav="solid" data-auth="guest">
  <!-- Navbar is built by static/js/main.js so it is identical on every page -->
  <div id="site-navbar"></div>

  <main id="main">
    <section class="auth-section">
      <div class="container">
        <div class="auth-card mx-auto" style="max-width:1000px">
          <div class="auth-visual">
            <img src="static/images/login.jpg" data-fallback="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=900&q=80" alt="Feastify dining room">
            <div><h2>Welcome back</h2><p>Log in to book tables and follow your reservations.</p></div>
          </div>
          <div class="auth-form-side">
            <h1>Log in</h1>
            <p class="text-muted-soft mb-4">Use the email you registered with.</p>
            <div id="loginAlert" class="form-alert" role="alert"></div>
            <form id="loginForm" class="feast-form" novalidate>
              <div class="mb-3">
                <label class="form-label" for="lEmail">Email</label>
                <div class="input-icon"><i class="fa-regular fa-envelope"></i><input id="lEmail" name="email" type="email" class="form-control" required autocomplete="email" placeholder="you@example.com"></div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="lPass">Password</label>
                <div class="input-icon"><i class="fa-solid fa-lock"></i><input id="lPass" name="password" type="password" class="form-control" required autocomplete="current-password" placeholder="Your password">
                  <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
              </div>
              <button type="submit" class="btn btn-leaf w-100 btn-lg"><i class="fa-solid fa-right-to-bracket me-2"></i>Log in</button>
            </form>
            <p class="auth-switch">New to Feastify? <a href="register.html">Create an account</a></p>
            <p class="auth-switch small mt-2">Restaurant staff? <a href="admin-login.html">Admin sign in</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is built by static/js/main.js -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
